<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loom Fabric Calculator</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}

/* Body level background adjustment for overall theme compatibility */
body {
  background: #0d0e12;
  color: #e2e8f0;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
}

/* Main app wrapper with flex layout for left side tabs */
.app{
  padding: 1.5rem;
  max-width: 1000px;
  margin: 0 auto;
  display: flex;
  gap: 24px;
}

/* Tabs container shifted to left side vertically */
.tabs{
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 200px;
  flex-shrink: 0;
  border-right: 1px solid rgba(0, 149, 255, 0.2);
  padding-right: 16px;
  margin-bottom: 0;
  border-bottom: none;
}

/* Tab button dark black styling with white text */
.tab{
  padding: 12px 16px;
  font-size: 14px;
  color: #ffffff;
  border: 1px solid rgba(255, 255, 255, 0.08);
  background: #16171b;
  border-radius: 8px;
  cursor: pointer;
  text-align: left;
  transition: all 0.3s ease;
  margin-bottom: 0;
}

/* Tab hover styling */
.tab:hover {
  background: #1f2128;
  border-color: rgba(0, 149, 255, 0.4);
}

/* Active Tab with Blue Neon Glow Look and White Font */
.tab.on{
  color: #ffffff !important;
  background: #0052cc !important;
  border-color: #0095ff !important;
  font-weight: 600;
  /* Premium Neon Glow Effects */
  box-shadow: 0 0 12px rgba(0, 149, 255, 0.6), 0 0 24px rgba(0, 149, 255, 0.3);
  text-shadow: 0 0 6px rgba(255, 255, 255, 0.8);
}

/* Panel content width control */
.panel{display:none; flex: 1;}
.panel.on{display:block}

/* Standardizing older design elements to match the new dark vibe */
:root {
  --color-background-secondary: #16171b;
  --color-border-tertiary: rgba(255, 255, 255, 0.1);
  --color-text-primary: #ffffff;
  --color-text-secondary: #94a3b8;
  --color-text-tertiary: #64748b;
  --border-radius-md: 8px;
  --border-radius-lg: 12px;
  --color-background-info: #002d72;
  --color-text-info: #63b3ed;
  --color-background-warning: #2d2415;
  --color-text-warning: #fbd38d;
}

input, select {
  background: #1f2128;
  border: 1px solid rgba(255, 255, 255, 0.15);
  color: #ffffff;
  padding: 8px 12px;
  border-radius: 6px;
}
input:focus, select:focus {
  outline: none;
  border-color: #0095ff;
  box-shadow: 0 0 5px rgba(0, 149, 255, 0.5);
}

.frow{display:flex;gap:10px;align-items:center;margin-bottom:12px}
.frow label{font-size:13px;color:var(--color-text-secondary);width:190px;flex-shrink:0}
.frow input,.frow select{flex:1;min-width:0}
.fl{font-size:11px;color:var(--color-text-tertiary);width:60px;text-align:right;flex-shrink:0}
.sec{font-size:11px;color:var(--color-text-tertiary);text-transform:uppercase;letter-spacing:.06em;margin:1.2rem 0 .6rem}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:1rem 0}
.card{background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:10px 12px}
.card .cl{font-size:11px;color:var(--color-text-tertiary);margin-bottom:3px}
.card .cv{font-size:18px;font-weight:500;color:var(--color-text-primary)}
.card .cu{font-size:11px;color:var(--color-text-secondary)}
.info-grid{border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);overflow:hidden;margin-top:1rem}
.irow{display:flex;justify-content:space-between;padding:9px 14px;border-bottom:0.5px solid var(--color-border-tertiary);font-size:13px;align-items:center}
.irow:last-child{border-bottom:none}
.irow .ik{color:var(--color-text-secondary)}
.irow .iv{font-weight:500;color:var(--color-text-primary);text-align:right}
.pill{display:inline-block;font-size:11px;padding:2px 9px;border-radius:20px}
.p-teal{background:#064e3b;color:#34d399}
.p-amber{background:#451a03;color:#fbbf24}
.p-blue{background:#1e3a8a;color:#60a5fa}
.p-red{background:#7f1d1d;color:#f87171}
.bar-wrap{margin-top:1rem}
.bar-label{display:flex;justify-content:space-between;font-size:12px;color:var(--color-text-secondary);margin-bottom:4px}
.bar-track{background:var(--color-background-secondary);border-radius:4px;height:8px;overflow:hidden}
.bar-fill{height:100%;border-radius:4px;transition:width .3s}
.cost-total{background:var(--color-background-info);border-radius:var(--border-radius-md);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;margin-top:1rem}
.cost-total .ctl{font-size:13px;color:var(--color-text-info)}
.cost-total .ctv{font-size:22px;font-weight:500;color:var(--color-text-info)}
.lang-btns{display:flex;gap:8px;margin-bottom:1.5rem}
.lbtn{padding:7px 18px;font-size:13px;border:0.5px solid var(--color-border-secondary);border-radius:20px;background:var(--color-background-primary);color:var(--color-text-secondary);cursor:pointer}
.lbtn.on{background:var(--color-background-secondary);color:var(--color-text-primary);font-weight:500;border-color:var(--color-border-primary)}
.manual-section{border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);overflow:hidden;margin-bottom:1rem}
.manual-header{background:var(--color-background-secondary);padding:10px 16px;font-size:13px;font-weight:500;color:var(--color-text-primary);display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.manual-header i{font-size:16px;color:var(--color-text-tertiary)}
.manual-body{padding:14px 16px;font-size:13px;color:var(--color-text-secondary);line-height:1.8;display:none}
.manual-body.open{display:block}
.manual-body b{font-weight:500;color:var(--color-text-primary)}
.step{display:flex;gap:10px;margin-bottom:10px;align-items:flex-start}
.step-num{background:var(--color-background-info);color:var(--color-text-info);border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:500;flex-shrink:0;margin-top:2px}
.tip-box{background:var(--color-background-warning);border-radius:var(--border-radius-md);padding:10px 14px;margin-top:10px;font-size:12px;color:var(--color-text-warning)}
.gloss-row{display:flex;gap:8px;padding:7px 0;border-bottom:0.5px solid var(--color-border-tertiary);font-size:13px}
.gloss-row:last-child{border-bottom:none}
.gloss-term{font-weight:500;color:var(--color-text-primary);width:120px;flex-shrink:0}
.gloss-def{color:var(--color-text-secondary)}

/* Mobile Responsive adjustment */
@media(max-width: 680px) {
  .app {
    flex-direction: column;
    padding: 1rem;
  }
  .tabs {
    flex-direction: row;
    width: 100%;
    overflow-x: auto;
    padding-bottom: 8px;
    padding-right: 0;
    border-right: none;
    border-bottom: 1px solid rgba(0, 149, 255, 0.2);
  }
  .tab {
    text-align: center;
    white-space: nowrap;
  }
}
</style>
</head>
<body>

<h2 class="sr-only" style="display:none;">Loom fabric calculator with user manual in English, Urdu and Roman Urdu</h2>

<div class="app">
  <!-- Left Side Vertical Tabs -->
  <div class="tabs">
    <button class="tab on" onclick="showTab('basic')">Bunai</button>
    <button class="tab" onclick="showTab('yarn')">Dhaaga</button>
    <button class="tab" onclick="showTab('cost')">Lagat</button>
    <button class="tab" onclick="showTab('shift')">Shift</button>
    <button class="tab" onclick="showTab('manual')">User Manual</button>
  </div>

  <!-- Right Side Panel Contents -->
  <div class="panel on" id="tab-basic">
    <div class="sec">Loom ki qisam</div>
    <div class="frow"><label>Loom type</label>
      <select id="loomType" onchange="go()">
        <option value="hand">Handloom</option>
        <option value="power" selected>Power loom</option>
        <option value="jacquard">Jacquard loom</option>
        <option value="rapier">Rapier loom</option>
      </select>
    </div>
    <div class="sec">Thread maloomat</div>
    <div class="frow"><label>Taana threads (warp)</label><input type="number" id="warp" value="600" min="1" oninput="go()"><span class="fl">count</span></div>
    <div class="frow"><label>Baana per inch (PPI)</label><input type="number" id="ppi" value="40" min="1" oninput="go()"><span class="fl">picks</span></div>
    <div class="frow"><label>Ends per inch (EPI)</label><input type="number" id="epi" value="60" min="1" oninput="go()"><span class="fl">ends</span></div>
    <div class="frow"><label>Yarn count (Ne)</label><input type="number" id="ne" value="20" min="1" oninput="go()"><span class="fl">Ne</span></div>
    <div class="sec">Required kapra</div>
    <div class="frow"><label>Length (meters)</label><input type="number" id="len" value="100" min="1" oninput="go()"><span class="fl">m</span></div>
    <div class="frow"><label>Shrinkage %</label><input type="number" id="shrink" value="5" min="0" max="30" oninput="go()"><span class="fl">%</span></div>
    <div class="cards" id="basicCards"></div>
    <div class="info-grid" id="basicInfo"></div>
  </div>

  <div class="panel" id="tab-yarn">
    <div class="sec">Dhaagay ki maloomat</div>
    <div class="frow"><label>Warp yarn price (Rs/kg)</label><input type="number" id="warpPrice" value="400" min="1" oninput="go()"><span class="fl">Rs</span></div>
    <div class="frow"><label>Weft yarn price (Rs/kg)</label><input type="number" id="weftPrice" value="380" min="1" oninput="go()"><span class="fl">Rs</span></div>
    <div class="frow"><label>Waste % (zaya)</label><input type="number" id="waste" value="3" min="0" max="20" oninput="go()"><span class="fl">%</span></div>
    <div class="sec">Fabric quality</div>
    <div class="cards" id="yarnCards"></div>
    <div class="info-grid" id="yarnInfo"></div>
    <div class="bar-wrap" id="qualBar"></div>
  </div>

  <div class="panel" id="tab-cost">
    <div class="sec">Lagat ka hisab</div>
    <div class="frow"><label>Labour rate (Rs/meter)</label><input type="number" id="labour" value="15" min="0" oninput="go()"><span class="fl">Rs</span></div>
    <div class="frow"><label>Electricity (Rs/hour)</label><input type="number" id="elec" value="80" min="0" oninput="go()"><span class="fl">Rs</span></div>
    <div class="frow"><label>Overhead (Rs/meter)</label><input type="number" id="overhead" value="10" min="0" oninput="go()"><span class="fl">Rs</span></div>
    <div class="frow"><label>Selling margin %</label><input type="number" id="margin" value="20" min="0" max="100" oninput="go()"><span class="fl">%</span></div>
    <div class="info-grid" id="costInfo"></div>
    <div class="cost-total" id="costTotal"></div>
  </div>

  <div class="panel" id="tab-shift">
    <div class="sec">Shift aur production planning</div>
    <div class="frow"><label>Shifts per day</label>
      <select id="shifts" onchange="go()">
        <option value="1">1 shift (8 ghante)</option>
        <option value="2" selected>2 shifts (16 ghante)</option>
        <option value="3">3 shifts (24 ghante)</option>
      </select>
    </div>
    <div class="frow"><label>Working days/month</label><input type="number" id="workDays" value="26" min="1" max="31" oninput="go()"><span class="fl">din</span></div>
    <div class="frow"><label>Efficiency %</label><input type="number" id="eff" value="85" min="10" max="100" oninput="go()"><span class="fl">%</span></div>
    <div class="frow"><label>Number of looms</label><input type="number" id="looms" value="4" min="1" oninput="go()"><span class="fl">karghay</span></div>
    <div class="cards" id="shiftCards"></div>
    <div class="info-grid" id="shiftInfo"></div>
  </div>

  <div class="panel" id="tab-manual">
    <div class="lang-btns">
      <button class="lbtn on" onclick="setLang('roman')">Roman Urdu</button>
      <button class="lbtn" onclick="setLang('urdu')">اردو</button>
      <button class="lbtn" onclick="setLang('en')">English</button>
    </div>
    <div id="manualContent"></div>
  </div>
</div>

<script>
function showTab(t){
  document.querySelectorAll('.tab').forEach((el,i)=>{el.classList.toggle('on',['basic','yarn','cost','shift','manual'][i]===t)});
  document.querySelectorAll('.panel').forEach(el=>el.classList.remove('on'));
  document.getElementById('tab-'+t).classList.add('on');
}

function setLang(l){
  document.querySelectorAll('.lbtn').forEach((b,i)=>b.classList.toggle('on',['roman','urdu','en'][i]===l));
  renderManual(l);
}

let openSec = null;
function toggleSec(id){
  const b = document.getElementById('mb-'+id);
  if(openSec && openSec !== id) document.getElementById('mb-'+openSec).classList.remove('open');
  b.classList.toggle('open');
  openSec = b.classList.contains('open') ? id : null;
}

      },
      {

<div class="tip-box">روزانہ، ماہانہ اور سالانہ پیداوار کے ساتھ آرڈر کتنے دن میں پورا ہوگا یہ بھی معلوم ہوگا۔</div>`
      },
      {
        icon: 'ti-book', title: 'الفاظ کی تشریح',
        body: `<div class="gloss-row"><span class="gloss-term">تانا / Warp</span><span class="gloss-def">سیدھا لمبا دھاگہ جو کرگھے میں کھنچا ہوتا ہے</span></div>
<div class="gloss-row"><span class="gloss-term">بانا / Weft</span><span class="gloss-def">آڑے میں جانے والا دھاگہ</span></div>
<div class="gloss-row"><span class="gloss-term">EPI</span><span class="gloss-def">ایک انچ میں تانے کے دھاگے</span></div>
<div class="gloss-row"><span class="gloss-term">PPI</span><span class="gloss-def">ایک انچ میں بانے کے دھاگے</span></div>
<div class="gloss-row"><span class="gloss-term">Ne (yarn count)</span><span class="gloss-def">دھاگے کی موٹائی — زیادہ نمبر مطلب باریک دھاگہ</span></div>
<div class="gloss-row"><span class="gloss-term">GSM</span><span class="gloss-def">گرام فی مربع میٹر — کپڑے کا وزن</span></div>
<div class="gloss-row"><span class="gloss-term">Shrinkage</span><span class="gloss-def">دھونے کے بعد کپڑے کا سکڑنا</span></div>`
      }
    ]
  },
  en: {
    dir: 'ltr',
    sections: [
      {
        icon: 'ti-info-circle', title: 'What does this calculator do?',
        body: `<div class="step"><div class="step-num">1</div><div>This calculator gives you complete specifications for fabric produced on a <b>loom (karghay)</b>.</div></div>
<div class="step"><div class="step-num">2</div><div>Thread count, yarn weight, production cost, and weaving time — all calculated in one place.</div></div>
<div class="step"><div class="step-num">3</div><div>Supports all four loom types: Handloom, Power loom, Jacquard, and Rapier.</div></div>
<div class="tip-box">Results update automatically as you type — no need to press a calculate button.</div>`
      },
      {
        icon: 'ti-tool', title: 'Bunai tab — how to use',
        body: `<div class="step"><div class="step-num">1</div><div><b>Loom type</b> — select the type of loom you are using.</div></div>
<div class="step"><div class="step-num">2</div><div><b>Warp threads (Taana)</b> — total number of lengthwise threads, e.g. 600.</div></div>
<div class="step"><div class="step-num">3</div><div><b>Weft PPI (Baana)</b> — picks per inch, how many crosswise threads per inch, e.g. 40.</div></div>

<div class="step"><div class="step-num">7</div><div><b>Shrinkage %</b> — how much the fabric shrinks after washing, typically 5%.</div></div>
<div class="tip-box">Fabric width, GSM, weaving time and fabric type will appear automatically below.</div>`
      },
      {
        icon: 'ti-forms', title: 'Yarn tab — yarn calculation',
        body: `<div class="step"><div class="step-num">1</div><div><b>Warp yarn price</b> — enter the cost of warp yarn in Rs/kg.</div></div>

<div class="tip-box">The quality score bar shows how fine your fabric is — closer to 100 means ultra-fine lawn.</div>`
      },
      {
        icon: 'ti-currency-rupee', title: 'Cost tab — total cost and profit',
        body: `<div class="step"><div class="step-num">1</div><div><b>Labour rate</b> — amount paid to the weaver per meter of fabric.</div></div>

      },
      {
        icon: 'ti-clock', title: 'Shift tab — production planning',
        body: `<div class="step"><div class="step-num">1</div><div><b>Shifts</b> — number of shifts per day; each shift is 8 hours.</div></div>

      },
      {
        icon: 'ti-book', title: 'Glossary of terms',
        body: `<div class="gloss-row"><span class="gloss-term">Warp / Taana</span><span class="gloss-def">Lengthwise threads stretched on the loom</span></div>
<div class="gloss-row"><span class="gloss-term">Weft / Baana</span><span class="gloss-def">Crosswise threads woven through the warp</span></div>

function renderManual(lang){
  const d = manualData[lang];
  const cont = document.getElementById('manualContent');
  cont.setAttribute('dir', d.dir);
  cont.innerHTML = d.sections.map((s,i)=>`
    <div class="manual-section">
      <div class="manual-header" onclick="toggleSec(${i})">
        <i class="ti ${s.icon}" aria-hidden="true"></i>
        <span style="flex:1">${s.title}</span>
        <i class="ti ti-chevron-down" aria-hidden="true"></i>
      </div>
      <div class="manual-body" id="mb-${i}">${s.body}</div>
    </div>
  `).join('');
  openSec = null;
}

function n(id){return parseFloat(document.getElementById(id).value)||0}
function fmt(v,d=1){return parseFloat(v.toFixed(d)).toLocaleString()}
function loomSpeed(t){return {hand:0.5,power:8,jacquard:10,rapier:14}[t]||8}

function go(){
  const loom=document.getElementById('loomType').value;
  const warp=n('warp'),ppi=n('ppi'),epi=n('epi')||1,ne=n('ne')||1;
  const len=n('len'),shrink=n('shrink'),waste=n('waste');
  const warpPrice=n('warpPrice'),weftPrice=n('weftPrice');
  const labour=n('labour'),elec=n('elec'),overhead=n('overhead'),margin=n('margin');
  const shifts=parseInt(document.getElementById('shifts').value);
  const workDays=n('workDays'),eff=n('eff'),looms=n('looms');

  const widthIn=(warp/epi).toFixed(1);
  const widthCm=(warp/epi*2.54).toFixed(1);
  const warpLen=len*(1+shrink/100);
  const gsm=((ppi*epi*25.4)/(ne*1.693)).toFixed(0);
  const tc=warp+ppi;
  const widthM=warp/epi*0.0254;
  const warpKg=((warp*warpLen*1000)/(ne*1693.6))*(1+waste/100);
  const weftKg=((ppi*39.37*len*widthM*1000)/(ne*1693.6))*(1+waste/100);
  const speed=loomSpeed(loom);
  const hoursPerDay=shifts*8;
  const totalHrs=warpLen/speed;
  const days=(totalHrs/hoursPerDay).toFixed(1);
  let fabType='',grade='',gradeColor='p-blue';
  if(epi<40){fabType='Khaddar / mota kapra';grade='Coarse';gradeColor='p-amber';}
  else if(epi<60){fabType='Poplin / sheeting';grade='Medium';gradeColor='p-blue';}
  else if(epi<80){fabType='Cambric / voile';grade='Fine';gradeColor='p-teal';}
  else{fabType='Lawn / muslin';grade='Ultra fine';gradeColor='p-teal';}
  const qualScore=Math.min(100,Math.round((epi/100)*100));
  document.getElementById('basicCards').innerHTML=`
    <div class="card"><div class="cl">Fabric width</div><div class="cv">${widthIn}"</div><div class="cu">${widthCm} cm</div></div>
    <div class="card"><div class="cl">Thread count</div><div class="cv">${tc}</div><div class="cu">warp+weft</div></div>
    <div class="card"><div class="cl">Warp length</div><div class="cv">${fmt(warpLen)}</div><div class="cu">meters</div></div>
    <div class="card"><div class="cl">GSM</div><div class="cv">${gsm}</div><div class="cu">g/m²</div></div>`;
  document.getElementById('basicInfo').innerHTML=`
    <div class="irow"><span class="ik">Kapray ki kisam</span><span class="iv">${fabType}</span></div>
    <div class="irow"><span class="ik">Quality grade</span><span class="iv"><span class="pill ${gradeColor}">${grade}</span></span></div>
    <div class="irow"><span class="ik">Bunai ka waqt</span><span class="iv">${fmt(totalHrs,0)} ghante / ${days} din</span></div>
    <div class="irow"><span class="ik">Production speed</span><span class="iv">${speed} m/ghanta</span></div>
    <div class="irow"><span class="ik">Total picks (baana)</span><span class="iv">${Math.round(ppi*len*39.37).toLocaleString()}</span></div>
    <div class="irow"><span class="ik">Fabric area</span><span class="iv">${fmt(len*widthM,1)} m²</span></div>`;
  document.getElementById('yarnCards').innerHTML=`
    <div class="card"><div class="cl">Warp yarn</div><div class="cv">${fmt(warpKg)}</div><div class="cu">kg</div></div>
    <div class="card"><div class="cl">Weft yarn</div><div class="cv">${fmt(weftKg)}</div><div class="cu">kg</div></div>
    <div class="card"><div class="cl">Total yarn</div><div class="cv">${fmt(warpKg+weftKg)}</div><div class="cu">kg</div></div>
    <div class="card"><div class="cl">Yarn cost</div><div class="cv">${fmt(warpKg*warpPrice+weftKg*weftPrice,0)}</div><div class="cu">Rs</div></div>`;
  document.getElementById('yarnInfo').innerHTML=`
    <div class="irow"><span class="ik">Warp yarn lagat</span><span class="iv">Rs ${fmt(warpKg*warpPrice,0)}</span></div>
    <div class="irow"><span class="ik">Weft yarn lagat</span><span class="iv">Rs ${fmt(weftKg*weftPrice,0)}</span></div>
    <div class="irow"><span class="ik">Waste included</span><span class="iv">${waste}%</span></div>
    <div class="irow"><span class="ik">Yarn per meter</span><span class="iv">${fmt((warpKg+weftKg)/len,3)} kg/m</span></div>`;
  document.getElementById('qualBar').innerHTML=`
    <div class="bar-label"><span>Quality score</span><span>${qualScore}/100</span></div>
    <div class="bar-track"><div class="bar-fill" style="width:${qualScore}%;background:${qualScore>70?'#1D9E75':qualScore>40?'#BA7517':'#E24B4A'}"></div></div>`;
  const yarnCost=warpKg*warpPrice+weftKg*weftPrice;
  const labourCost=labour*len;
  const elecCost=elec*totalHrs;
  const ohCost=overhead*len;
  const totalCost=yarnCost+labourCost+elecCost+ohCost;
  const sellingPrice=totalCost*(1+margin/100);
  const perMeter=totalCost/len;
  const sellingPerM=sellingPrice/len;
  document.getElementById('costInfo').innerHTML=`
    <div class="irow"><span class="ik">Yarn lagat</span><span class="iv">Rs ${fmt(yarnCost,0)}</span></div>
    <div class="irow"><span class="ik">Labour lagat</span><span class="iv">Rs ${fmt(labourCost,0)}</span></div>
    <div class="irow"><span class="ik">Bijli ka kharch</span><span class="iv">Rs ${fmt(elecCost,0)}</span></div>
    <div class="irow"><span class="ik">Overhead</span><span class="iv">Rs ${fmt(ohCost,0)}</span></div>
    <div class="irow"><span class="ik">Cost per meter</span><span class="iv">Rs ${fmt(perMeter,1)}/m</span></div>
    <div class="irow"><span class="ik">Selling price/meter</span><span class="iv"><span class="pill p-teal">Rs ${fmt(sellingPerM,1)}/m</span></span></div>
    <div class="irow"><span class="ik">Net profit</span><span class="iv"><span class="pill p-blue">Rs ${fmt(sellingPrice-totalCost,0)}</span></span></div>`;
  document.getElementById('costTotal').innerHTML=`
    <span class="ctl">Total selling price (${fmt(len,0)} m)</span>
    <span class="ctv">Rs ${fmt(sellingPrice,0)}</span>`;
  const effSpeed=speed*(eff/100);
  const dailyProd=effSpeed*hoursPerDay;
  const monthlyProd=dailyProd*workDays*looms;
  const daysNeeded=(warpLen/(effSpeed*hoursPerDay*looms)).toFixed(1);
  const monthlyRevenue=monthlyProd*sellingPerM;
  document.getElementById('shiftCards').innerHTML=`
    <div class="card"><div class="cl">Daily production</div><div class="cv">${fmt(dailyProd*looms,0)}</div><div class="cu">m/din</div></div>
    <div class="card"><div class="cl">Monthly output</div><div class="cv">${fmt(monthlyProd,0)}</div><div class="cu">meters</div></div>
    <div class="card"><div class="cl">Order complete in</div><div class="cv">${daysNeeded}</div><div class="cu">din</div></div>
    <div class="card"><div class="cl">Monthly revenue</div><div class="cv">${fmt(monthlyRevenue/1000,1)}K</div><div class="cu">Rs</div></div>`;
  document.getElementById('shiftInfo').innerHTML=`
    <div class="irow"><span class="ik">Active looms</span><span class="iv">${looms} karghay</span></div>
    <div class="irow"><span class="ik">Ghante per day</span><span class="iv">${hoursPerDay} ghante (${shifts} shift)</span></div>
    <div class="irow"><span class="ik">Effective speed</span><span class="iv">${fmt(effSpeed,1)} m/ghanta</span></div>
    <div class="irow"><span class="ik">Efficiency</span><span class="iv"><span class="pill ${eff>=80?'p-teal':eff>=60?'p-amber':'p-red'}">${eff}%</span></span></div>
    <div class="irow"><span class="ik">Monthly working hours</span><span class="iv">${fmt(hoursPerDay*workDays*looms,0)} ghante</span></div>
    <div class="irow"><span class="ik">Annual production</span><span class="iv">${fmt(monthlyProd*12,0)} meters</span></div>`;
}

renderManual('roman');
go();
</script>

</body>
</html>
